server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/wealth-builder-pro;
    index index.html;

    # Dashboard static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Archived reports
    location /reports/ {
        alias /var/www/wealth-builder-pro/reports/;
        autoindex on;
    }

    # Dashboard JSON API
    location /api/latest {
        alias /var/www/wealth-builder-pro/api/latest.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Gzip compression
    gzip on;
    gzip_types text/html text/css application/javascript application/json;
    gzip_min_length 256;

    access_log /var/log/nginx/wealth-builder-pro.access.log;
    error_log /var/log/nginx/wealth-builder-pro.error.log;
}
